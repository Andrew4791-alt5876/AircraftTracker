[tool.poetry]
name = "pythonproject2"
version = "0.1.0"
description = ""
authors = ["Andrei Tiurin"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude = ".venv"

[tool.poetry.group.lint.dependencies]
flake8 = ">=7.3.0,<8.0.0"
black = ">=26.3.0,<27.0.0"
isort = ">=8.0.1,<9.0.0"
mypy = ">=1.15,<2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.2,<10.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
